name: Refresh GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh-github-pages:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Restore Python environment
        id: python-environment
        uses: actions/cache@v4
        with:
          path: .venv
          key: ${{ runner.os }}-python-3.12-venv-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        if: steps.python-environment.outputs.cache-hit != 'true'
        run: python -m venv .venv && .venv/bin/python -m pip install --requirement requirements.txt

      - name: Refresh GitHub Pages source data
        env:
          GOOGLE_DRIVE_UPLOAD_FOLDER_ID: ${{ vars.GOOGLE_DRIVE_UPLOAD_FOLDER_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          PYTHONPATH: src
        run: .venv/bin/python src/main.py --steps refresh-github-pages
