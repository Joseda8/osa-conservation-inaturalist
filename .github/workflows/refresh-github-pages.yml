name: Refresh GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh-github-pages:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Refresh GitHub Pages source data
        env:
          GOOGLE_DRIVE_UPLOAD_FOLDER_ID: ${{ vars.GOOGLE_DRIVE_UPLOAD_FOLDER_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          PYTHONPATH: src
        run: python src/main.py --steps refresh-github-pages
