name: Refresh GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Restore Python environment
        id: python-environment
        uses: actions/cache@v5
        with:
          path: .venv
          key: ${{ runner.os }}-python-3.12-venv-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        if: steps.python-environment.outputs.cache-hit != 'true'
        run: python -m venv .venv && .venv/bin/python -m pip install --requirement requirements.txt

      - name: Refresh GitHub Pages source data
        env:
          GOOGLE_DRIVE_UPLOAD_FOLDER_ID: ${{ vars.GOOGLE_DRIVE_UPLOAD_FOLDER_ID }}
          GOOGLE_DRIVE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_DRIVE_OAUTH_TOKEN_JSON }}
          PYTHONPATH: src
        run: .venv/bin/python src/main.py --steps refresh-github-pages

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix web --no-audit --no-fund --prefer-offline

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build React site
        env:
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build --prefix web

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages site
        id: deployment
        uses: actions/deploy-pages@v5
