services:
  postgres:
    image: postgres:16
    container_name: osa-inaturalist-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: osa_inaturalist
      POSTGRES_USER: osa
      POSTGRES_PASSWORD: osa
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
